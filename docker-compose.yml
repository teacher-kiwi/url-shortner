# 설정은 .env 에서 읽는다(.env.example 참고).
services:
  app:
    build: .
    image: url-shortner
    container_name: url-shortner
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - proxy

# 리버스 프록시(nginx 등)와 같은 도커 네트워크에 붙는다. 포트는 밖으로 열지 않는다.
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
